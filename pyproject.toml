[project]
name = "christie-hunter"
version = "0.2.0"
description = "Find English-language Agatha Christie books/ebooks on amazon.co.uk NOT published by HarperCollins"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
]

[project.scripts]
christie-hunter = "christie_hunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/christie_hunter"]
